# proxy/proxy.conf
server {
    # Listen on standard HTTP port
    listen 80;

    # Route for static content and web pages (all non-/api requests)
    location / {
        # Pass the request to the front-end service (container)
        proxy_pass http://front-end:9000;
    }

    # Route for API requests
    location /api {
        # Pass the request to the back-end service (container)
        # Nginx automatically handles the Docker network DNS resolution
        proxy_pass http://back-end:5252;
    }
}
