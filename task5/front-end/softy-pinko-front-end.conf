server {
    # Listen on port 9000 as recommended
    listen 9000;
    server_name localhost;

    # Set the root directory to where the front-end files are copied
    root /var/www/html/softy-pinko-front-end;

    # Define the default index file (entry point of the application)
    index index.html index.htm;

    # Main location block to handle requests
    location / {
        # Try serving the request as a file, then as a directory, then fall back to index.html
        # This is a common setup for single-page applications
        try_files $uri $uri/ /index.html;
    }
}
