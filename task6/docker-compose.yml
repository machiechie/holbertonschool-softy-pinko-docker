version: '3.8'

services:
  # 1. Proxy Service (NEW)
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: softy-pinko-proxy:task5
    # Only map the proxy's port to the host machine
    ports:
      - "80:80"
    # The proxy needs both services to be running
    depends_on:
      - front-end
      - back-end

  # 2. Front-end Service
  front-end:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    image: softy-pinko-front-end:task5
    # NOTE: Host port mapping (9000:9000) is removed. 
    # Port 9000 is open internally for other Docker containers (the proxy)
    depends_on:
      - back-end

  # 3. Back-end Service
  back-end:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    image: softy-pinko-back-end:task5
    # NOTE: Host port mapping (5252:5252) is removed. 
    # Port 5252 is open internally for other Docker containers (the proxy)
